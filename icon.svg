<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 🌙 Icône NOCTRA — la lune EXACTE du logo : seul le bord EXTÉRIEUR est
       tracé (lavande), l'intérieur est un voile dégradé (clair en haut,
       estompé en bas), halo doux DANS l'ouverture du croissant. -->
  <defs>
    <radialGradient id="nuit" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#20233a"/>
      <stop offset="100%" stop-color="#0c0d13"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8d94c9" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#8d94c9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8d94c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lunev" x1="0.2" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#cfd4e8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cfd4e8" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#nuit)"/>
  <circle cx="112" cy="98" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="404" cy="132" r="3" fill="#d8ddf5" opacity="0.45"/>
  <circle cx="356" cy="72" r="2.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="86" cy="300" r="3" fill="#d8ddf5" opacity="0.3"/>
  <circle cx="430" cy="368" r="3.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="170" cy="430" r="2.5" fill="#ffffff" opacity="0.28"/>
  <circle cx="316" cy="248" r="180" fill="url(#halo)"/>
  <g transform="rotate(-15 256 256)">
    <path d="M 322 106 A 160 160 0 1 0 322 406 A 143 143 0 1 1 322 106 Z" fill="url(#lunev)"/>
    <path d="M 322 106 A 160 160 0 1 0 322 406" stroke="#b9bfdd" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
</svg>
